# Apache vhost for hueyb.com — sits behind nginx, bound to localhost only.
# nginx (deploy/nginx-hueyb.conf) proxies to this on 127.0.0.1:8090; Apache
# never listens on a public interface.
#
# Install path: /etc/apache2/sites-available/hueyb.com.conf, then:
#   sudo a2ensite hueyb.com
#   sudo a2enmod headers expires rewrite
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# Requires an extra Listen directive in /etc/apache2/ports.conf:
#   Listen 127.0.0.1:8090

<VirtualHost 127.0.0.1:8090>
    ServerName hueyb.com
    ServerAlias www.hueyb.com

    # Eleventy's build output — kept in sync by deploy/deploy.sh. This is a
    # plain static tree (every URL is an index.html under its own folder),
    # so no rewrite rules are needed for pretty URLs.
    DocumentRoot /var/www/hueyb-website/_site

    <Directory /var/www/hueyb-website/_site>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Cache hashed/unique-filename media hard; HTML stays revalidated so
    # content edits show up immediately after a deploy.
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/html "access plus 0 seconds"
        ExpiresByType image/jpeg "access plus 30 days"
        ExpiresByType image/png "access plus 30 days"
        ExpiresByType image/svg+xml "access plus 30 days"
        ExpiresByType video/mp4 "access plus 30 days"
        ExpiresByType text/css "access plus 7 days"
        ExpiresByType application/javascript "access plus 7 days"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/hueyb-error.log
    CustomLog ${APACHE_LOG_DIR}/hueyb-access.log combined
</VirtualHost>
