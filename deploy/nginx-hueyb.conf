# nginx config for hueyb.com — Debian VPS, nginx in front of Apache.
#
# Role split: nginx owns the public port (80/443), terminates TLS, handles
# gzip/caching headers, and reverse-proxies everything to Apache, which is
# bound to localhost only and actually serves the built static site.
#
# Install path: /etc/nginx/sites-available/hueyb.com, then:
#   sudo ln -s /etc/nginx/sites-available/hueyb.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS certs below are the paths certbot's nginx plugin will create/rewrite
# automatically on first run (see deploy/README.md) — the paths are already
# correct, just run certbot and it edits this block in place.

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name hueyb.com www.hueyb.com;

    # Let certbot's HTTP-01 challenge through before the redirect exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hueyb.com$request_uri;
    }
}

# Canonicalize www -> apex, once TLS is issued for both.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hueyb.com;

    ssl_certificate     /etc/letsencrypt/live/hueyb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hueyb.com/privkey.pem;

    return 301 https://hueyb.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hueyb.com;

    ssl_certificate     /etc/letsencrypt/live/hueyb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hueyb.com/privkey.pem;

    # Reasonable modern defaults; certbot --nginx will add its own
    # ssl_protocols/ciphers include if you run it instead of hand-editing.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 200M; # CMS media uploads can be sizeable videos

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
    gzip_min_length 1024;

    # Video/image assets: served through Apache but cached hard at the edge
    # since filenames don't change on edit (Decap writes new filenames).
    location ~* \.(jpg|jpeg|png|gif|svg|webp|mp4|mov|woff2?)$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
