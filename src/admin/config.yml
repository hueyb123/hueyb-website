backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, hint: "Used to sort projects, newest first." }
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Current", value: "current" }
          - { label: "Past", value: "past" }
        default: "current"
      - { label: "Tile Caption", name: "caption", widget: "string", hint: "Short line shown on the project tile, e.g. \"2026 — Ongoing\"" }
      - { label: "Cover Image", name: "cover", widget: "image", hint: "Shown as the background of the project tile." }
      - label: "Media"
        name: "media"
        widget: "list"
        summary: "{{fields.type}} — {{fields.caption}}"
        hint: "Add as many images, videos, or sound files as this piece needs."
        fields:
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - { label: "Image", value: "image" }
              - { label: "Video", value: "video" }
              - { label: "Audio", value: "audio" }
          - { label: "File", name: "file", widget: "file" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Description", name: "body", widget: "markdown" }
