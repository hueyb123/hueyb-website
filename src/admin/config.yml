backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

local_backend: true

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "string", required: false, pattern: ['^\d{4}(-\d{2}-\d{2})?$', "Enter a year (e.g. 2024) or a full date (e.g. 2024-03-15)."], hint: "A year is enough — add the full date only if you want more precision." }
      - { label: "Ongoing", name: "ongoing", widget: "boolean", default: false, hint: "Check this if the project is still in progress. Ongoing projects sort to the top ahead of everything else, unless Display Order below is set." }
      - { label: "Display Order", name: "order", widget: "number", value_type: "float", required: false, hint: "Optional. Lower numbers show first, overriding Ongoing and date. Leave blank to sort automatically instead. Tip: use a decimal like 1.5 to slot a project between two others without renumbering everything." }
      - { label: "Tile Caption", name: "caption", widget: "string", required: false, hint: "Optional short line shown on the project tile — a year, a phrase, or leave blank." }
      - { label: "Cover Image", name: "cover", widget: "image", hint: "Shown as the background of the project tile." }
      - label: "Media"
        name: "media"
        widget: "list"
        summary: "{{fields.type}} — {{fields.caption}}"
        hint: "Add as many images, videos, or sound files as this piece needs."
        fields:
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - { label: "Image", value: "image" }
              - { label: "Video", value: "video" }
              - { label: "Audio", value: "audio" }
          - { label: "File", name: "file", widget: "file" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "studio"
    label: "Studio Posts"
    folder: "src/content/studio"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{headline}}"
    fields:
      - { label: "Date", name: "date", widget: "datetime", hint: "Used to sort posts, newest first, unless Display Order below is set." }
      - { label: "Display Order", name: "order", widget: "number", value_type: "float", required: false, hint: "Optional. Lower numbers show first, overriding the date. Leave blank to sort by date instead. Tip: use a decimal like 1.5 to slot a post between two others without renumbering everything." }
      - { label: "Headline (optional)", name: "headline", widget: "string", required: false, hint: "Most posts can skip this and just lead with the date." }
      - label: "Media"
        name: "media"
        widget: "list"
        summary: "{{fields.type}} — {{fields.caption}}"
        hint: "Add as many images, videos, or sound files as this post needs. The first image becomes the tile thumbnail."
        fields:
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - { label: "Image", value: "image" }
              - { label: "Video", value: "video" }
              - { label: "Audio", value: "audio" }
          - { label: "File", name: "file", widget: "file" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Musing", name: "body", widget: "markdown", hint: "Thoughts, progress notes, whatever's on your mind about this." }

  - name: "studio_settings"
    label: "Studio Settings"
    files:
      - name: "studio_settings"
        label: "Studio Settings"
        file: "src/_data/studio.json"
        fields:
          - { label: "Tagline", name: "tagline", widget: "text", hint: "Shown under the STUDIO heading at the top of the page." }

  - name: "prints"
    label: "Prints"
    folder: "src/content/prints"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Display Order", name: "order", widget: "number", value_type: "float", required: false, hint: "Optional. Lower numbers show first. Leave blank to sort alphabetically by name instead. Tip: use a decimal like 1.5 to slot a print between two others without renumbering everything." }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image" }
      - label: "Edition Type"
        name: "edition_type"
        widget: "select"
        default: "open"
        hint: "Open = you print it whenever it sells, no fixed count. Limited = a fixed number of copies exist."
        options:
          - { label: "Open / Print-on-Demand", value: "open" }
          - { label: "Limited Edition", value: "limited" }
      - label: "Sizes"
        name: "variants"
        widget: "list"
        summary: "{{fields.label}} — ${{fields.price}}"
        hint: "Add one entry even if there's only a single size. Each size has its own price and sold-out status."
        fields:
          - { label: "Size / Label", name: "label", widget: "string", hint: "e.g. \"8x10\", or \"Standard\" if there's only one." }
          - { label: "Price (USD)", name: "price", widget: "number", value_type: "float", hint: "Include shipping in this number — nothing is added at checkout." }
          - { label: "Total Copies", name: "quantity", widget: "number", value_type: "int", required: false, hint: "Only matters for Limited Edition prints — how many of this size exist." }
          - { label: "Sold Out", name: "sold_out", widget: "boolean", default: false }

  - name: "cv"
    label: "CV"
    files:
      - name: "cv"
        label: "CV"
        file: "src/_data/cv.json"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            summary: "{{fields.year}} — {{fields.title}}"
            hint: "Drag to reorder within the list. Category controls which section on the page it shows up in."
            fields:
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Solo Exhibition", value: "solo" }
                  - { label: "Group Exhibition", value: "group" }
                  - { label: "Residency", value: "residency" }
                  - { label: "Workshop", value: "workshop" }
                  - { label: "Education", value: "education" }
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Venue", name: "venue", widget: "string" }

  - name: "navigation"
    label: "Header Navigation"
    files:
      - name: "navigation"
        label: "Header Navigation"
        file: "src/_data/navigation.json"
        fields:
          - label: "Links"
            name: "items"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "Drag to reorder — this controls the order links appear in the header. Leave Link URL blank and use Dropdown Links instead to make this item open a dropdown menu (like About)."
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link URL", name: "url", widget: "string", required: false, hint: "e.g. /studio/ — leave blank if this is a dropdown group instead." }
              - label: "Dropdown Links"
                name: "children"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                hint: "Only used if this item is a dropdown group (like About) rather than a direct link."
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link URL", name: "url", widget: "string" }

  - name: "home"
    label: "Home"
    files:
      - name: "home"
        label: "Home Page"
        file: "src/_data/home.json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - label: "Background Videos"
            name: "videos"
            widget: "list"
            summary: "{{fields.file}}"
            hint: "One random video from this pool plays each time someone loads the home page."
            fields:
              - { label: "Video File", name: "file", widget: "file" }
