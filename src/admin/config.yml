backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

local_backend: true

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "installations"
    label: "Installations"
    folder: "src/content/installations"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "string", required: false, pattern: ['^\d{4}(-\d{2}-\d{2})?$', "Enter a year (e.g. 2024) or a full date (e.g. 2024-03-15)."], hint: "A year is enough — add the full date only if you want more precision." }
      - { label: "Ongoing", name: "ongoing", widget: "boolean", default: false, hint: "Check this if the piece is still in progress. Ongoing pieces sort to the top ahead of everything else, unless Display Order below is set." }
      - { label: "Display Order", name: "order", widget: "number", value_type: "float", required: false, hint: "Optional. Lower numbers show first, overriding Ongoing and date. Leave blank to sort automatically instead. Tip: use a decimal like 1.5 to slot a piece between two others without renumbering everything." }
      - { label: "Hidden", name: "hidden", widget: "boolean", default: false, hint: "Hide this piece from the live site without deleting it." }
      - { label: "Tile Caption", name: "caption", widget: "string", required: false, hint: "Optional short line shown on the tile — a year, a phrase, or leave blank." }
      - { label: "Cover Image", name: "cover", widget: "image", hint: "Shown as the background of the tile." }
      - label: "Media"
        name: "media"
        widget: "list"
        summary: "{{fields.type}} — {{fields.caption}}"
        hint: "Add as many images, videos, or sound files as this piece needs. Each one gets its own thumbnail on the piece's page."
        fields:
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - { label: "Image", value: "image" }
              - { label: "Video", value: "video" }
              - { label: "Audio", value: "audio" }
          - { label: "File", name: "file", widget: "file" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Hidden", name: "hidden", widget: "boolean", default: false, hint: "Exclude this item from the piece without deleting it." }
      - { label: "Description", name: "body", widget: "markdown", required: false }

  - name: "photography"
    label: "Photography"
    folder: "src/content/photography"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "string", required: false, pattern: ['^\d{4}(-\d{2}-\d{2})?$', "Enter a year (e.g. 2024) or a full date (e.g. 2024-03-15)."], hint: "A year is enough — add the full date only if you want more precision." }
      - { label: "Ongoing", name: "ongoing", widget: "boolean", default: false, hint: "Check this if the piece is still in progress. Ongoing pieces sort to the top ahead of everything else, unless Display Order below is set." }
      - { label: "Display Order", name: "order", widget: "number", value_type: "float", required: false, hint: "Optional. Lower numbers show first, overriding Ongoing and date. Leave blank to sort automatically instead. Tip: use a decimal like 1.5 to slot a piece between two others without renumbering everything." }
      - { label: "Hidden", name: "hidden", widget: "boolean", default: false, hint: "Hide this piece from the live site without deleting it." }
      - { label: "Tile Caption", name: "caption", widget: "string", required: false, hint: "Optional short line shown on the tile — a year, a phrase, or leave blank." }
      - { label: "Cover Image", name: "cover", widget: "image", hint: "Shown as the background of the tile." }
      - label: "Media"
        name: "media"
        widget: "list"
        summary: "{{fields.type}} — {{fields.caption}}"
        hint: "Add as many images, videos, or sound files as this piece needs. Each one gets its own thumbnail on the piece's page."
        fields:
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - { label: "Image", value: "image" }
              - { label: "Video", value: "video" }
              - { label: "Audio", value: "audio" }
          - { label: "File", name: "file", widget: "file" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Hidden", name: "hidden", widget: "boolean", default: false, hint: "Exclude this item from the piece without deleting it." }
      - { label: "Description", name: "body", widget: "markdown", required: false }

  - name: "painting"
    label: "Painting Posts"
    folder: "src/content/painting"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{mood | default('Good Times')}} — {{headline | default('Untitled')}}"
    view_groups:
      - { label: "Section", field: mood }
    fields:
      - { label: "Date", name: "date", widget: "datetime", required: false, hint: "Optional. Used to sort posts, newest first, unless Display Order below is set." }
      - { label: "Display Order", name: "order", widget: "number", value_type: "float", required: false, hint: "Optional. Lower numbers show first, overriding the date. Leave blank to sort by date instead. Tip: use a decimal like 1.5 to slot a post between two others without renumbering everything." }
      - { label: "Hidden", name: "hidden", widget: "boolean", default: false, hint: "Hide this post from the live site without deleting it." }
      - label: "Section"
        name: "mood"
        widget: "select"
        default: "Good Times"
        hint: "Which gallery this post shows up in. Shows on every entry in the list below, and you can also use the \"Group by\" control above the list to cluster posts by section."
        options:
          - { label: "Good Times", value: "Good Times" }
          - { label: "Bad Times", value: "Bad Times" }
      - { label: "Title", name: "headline", widget: "string", required: false, hint: "Optional." }
      - label: "Media"
        name: "media"
        widget: "list"
        summary: "{{fields.type}} — {{fields.caption}}"
        hint: "Add as many images, videos, or sound files as this post needs. The first image becomes the tile thumbnail."
        fields:
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - { label: "Image", value: "image" }
              - { label: "Video", value: "video" }
              - { label: "Audio", value: "audio" }
          - { label: "File", name: "file", widget: "file" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Hidden", name: "hidden", widget: "boolean", default: false, hint: "Exclude this item from the piece without deleting it." }
      - { label: "Details", name: "body", widget: "markdown", required: false, hint: "Optional." }

  - name: "painting_settings"
    label: "Painting Settings"
    files:
      - name: "painting_settings"
        label: "Painting Settings"
        file: "src/_data/painting_settings.json"
        fields:
          - { label: "Tagline", name: "tagline", widget: "text", required: false, hint: "Shown under the GOOD TIMES heading only (not Bad Times), on both the landing panel and the Good Times gallery." }

  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{headline}}"
    fields:
      - { label: "Date", name: "date", widget: "datetime", hint: "Used to sort posts, newest first, unless Display Order below is set." }
      - { label: "Display Order", name: "order", widget: "number", value_type: "float", required: false, hint: "Optional. Lower numbers show first, overriding the date. Leave blank to sort by date instead. Tip: use a decimal like 1.5 to slot a post between two others without renumbering everything." }
      - { label: "Hidden", name: "hidden", widget: "boolean", default: false, hint: "Hide this post from the live site without deleting it." }
      - { label: "Headline (optional)", name: "headline", widget: "string", required: false, hint: "Most posts can skip this and just lead with the date." }
      - label: "Media"
        name: "media"
        widget: "list"
        summary: "{{fields.type}} — {{fields.caption}}"
        hint: "Add as many images, videos, or sound files as this post needs. The first image becomes the tile thumbnail."
        fields:
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - { label: "Image", value: "image" }
              - { label: "Video", value: "video" }
              - { label: "Audio", value: "audio" }
          - { label: "File", name: "file", widget: "file" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Hidden", name: "hidden", widget: "boolean", default: false, hint: "Exclude this item from the piece without deleting it." }
      - { label: "Musing", name: "body", widget: "markdown", hint: "Thoughts, progress notes, whatever's on your mind about this." }

  - name: "blog_settings"
    label: "Blog Settings"
    files:
      - name: "blog_settings"
        label: "Blog Settings"
        file: "src/_data/blog.json"
        fields:
          - { label: "Tagline", name: "tagline", widget: "text", hint: "Shown under the BLOG heading at the top of the page." }

  - name: "prints"
    label: "Prints"
    folder: "src/content/prints"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Display Order", name: "order", widget: "number", value_type: "float", required: false, hint: "Optional. Lower numbers show first. Leave blank to sort alphabetically by name instead. Tip: use a decimal like 1.5 to slot a print between two others without renumbering everything." }
      - { label: "Hidden", name: "hidden", widget: "boolean", default: false, hint: "Hide this print from the shop without deleting it." }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image" }
      - label: "Edition Type"
        name: "edition_type"
        widget: "select"
        default: "open"
        hint: "Open = you print it whenever it sells, no fixed count. Limited = a fixed number of copies exist."
        options:
          - { label: "Open / Print-on-Demand", value: "open" }
          - { label: "Limited Edition", value: "limited" }
      - label: "Sizes"
        name: "variants"
        widget: "list"
        summary: "{{fields.label}} — ${{fields.price}}"
        hint: "Add one entry even if there's only a single size. Each size has its own price and sold-out status."
        fields:
          - { label: "Size / Label", name: "label", widget: "string", hint: "e.g. \"8x10\", or \"Standard\" if there's only one." }
          - { label: "Price (USD)", name: "price", widget: "number", value_type: "float", hint: "Include shipping in this number — nothing is added at checkout." }
          - { label: "Total Copies", name: "quantity", widget: "number", value_type: "int", required: false, hint: "Only matters for Limited Edition prints — how many of this size exist." }
          - { label: "Sold Out", name: "sold_out", widget: "boolean", default: false }

  - name: "cv"
    label: "CV"
    folder: "src/content/cv"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{year}} — {{title}}"
    fields:
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Solo Exhibition", value: "solo" }
          - { label: "Group Exhibition", value: "group" }
          - { label: "Residency", value: "residency" }
          - { label: "Workshop", value: "workshop" }
          - { label: "Education", value: "education" }
      - { label: "Year", name: "year", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "Display Order", name: "order", widget: "number", value_type: "float", required: false, hint: "Optional. Lower numbers show first within their category section, overriding the year. Leave blank to sort by year (newest first) instead." }
      - { label: "Hidden", name: "hidden", widget: "boolean", default: false, hint: "Hide this entry from the CV without deleting it." }

  - name: "navigation"
    label: "Header Navigation"
    files:
      - name: "navigation"
        label: "Header Navigation"
        file: "src/_data/navigation.json"
        fields:
          - label: "Links"
            name: "items"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "Drag to reorder — this controls the order links appear in the header. Leave Link URL blank and use Dropdown Links instead to make this item open a dropdown menu (like About)."
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link URL", name: "url", widget: "string", required: false, hint: "e.g. /blog/ — leave blank if this is a dropdown group instead." }
              - label: "Dropdown Links"
                name: "children"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                hint: "Only used if this item is a dropdown group (like About) rather than a direct link."
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link URL", name: "url", widget: "string" }

  - name: "home"
    label: "Home"
    files:
      - name: "home"
        label: "Home Page"
        file: "src/_data/home.json"
        fields:
          - label: "Titles"
            name: "titles"
            widget: "list"
            required: false
            summary: "{{fields.text}}"
            hint: "Add as many as you want, or none - one random title shows each time someone loads the home page."
            fields:
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Hidden", name: "hidden", widget: "boolean", default: false, hint: "Exclude this from the random rotation without deleting it." }
          - label: "Descriptions"
            name: "descriptions"
            widget: "list"
            required: false
            summary: "{{fields.text}}"
            hint: "Add as many as you want, or none - one random description shows each time someone loads the home page."
            fields:
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Hidden", name: "hidden", widget: "boolean", default: false, hint: "Exclude this from the random rotation without deleting it." }
          - label: "Background Videos"
            name: "videos"
            widget: "list"
            summary: "{{fields.file}}"
            hint: "One random video from this pool plays each time someone loads the home page."
            fields:
              - { label: "Video File", name: "file", widget: "file" }
